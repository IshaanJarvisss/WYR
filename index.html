<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYR OLYMPICS | PRO HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon-cyan: #00f2ff; 
            --neon-pink: #ff00e5; 
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(0, 242, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Poppins', sans-serif; background: #020205; color: white; 
            overflow-x: hidden; min-height: 100vh;
            padding-top: 80px; padding-bottom: 80px;
            /* Animated Stars */
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            animation: moveStars 100s linear infinite;
        }
        @keyframes moveStars { from { background-position: 0 0; } to { background-position: 1000px 500px; } }

        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px);
            border-bottom: 3px solid var(--neon-cyan);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; box-shadow: 0 0 20px var(--neon-cyan);
        }
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px);
            border-top: 3px solid var(--neon-pink);
            display: flex; align-items: center; justify-content: space-around;
            z-index: 1000; box-shadow: 0 0 20px var(--neon-pink);
        }

        .container { width: 92%; max-width: 500px; margin: 0 auto; position: relative; z-index: 1; }
        .page { display: none; animation: slideIn 0.4s ease-out; }
        .active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        h1 { font-family: 'Orbitron'; font-weight: 900; font-size: 2.2rem; text-align: center; margin-bottom: 25px; color: #fff; text-shadow: 0 0 20px var(--neon-cyan); }

        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.6); }

        /* GLOWING BUTTONS */
        .btn { 
            display: block; width: 100%; padding: 18px; margin: 15px 0; 
            background: linear-gradient(45deg, var(--neon-cyan), #0088ff); 
            border: none; border-radius: 15px; color: #000; 
            font-family: 'Orbitron'; font-weight: 900; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 0 15px var(--neon-cyan); transition: 0.3s;
            animation: pulseCyan 3s infinite;
        }
        @keyframes pulseCyan { 0% { box-shadow: 0 0 10px var(--neon-cyan); } 50% { box-shadow: 0 0 25px var(--neon-cyan); } 100% { box-shadow: 0 0 10px var(--neon-cyan); } }

        .btn-nav { 
            background: transparent; border: 2px solid var(--neon-pink); 
            color: var(--neon-pink); font-size: 0.8rem; padding: 12px;
            text-shadow: 0 0 10px var(--neon-pink); font-weight: 900;
        }

        /* LIVE FEED BOXES */
        .feed-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--neon-cyan); }
        .feed-owner { color: var(--neon-cyan); font-weight: bold; font-size: 0.8rem; display: block; }
        .feed-time { font-size: 0.6rem; color: #666; }

        input, textarea { width: 100%; padding: 15px; margin-bottom: 10px; background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 12px; color: white; }

        /* LEADERBOARD TABLE */
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        tr { background: rgba(255,255,255,0.05); }
        td { padding: 18px 12px; font-weight: 800; }
        .rank-num { color: var(--neon-cyan); font-family: 'Orbitron'; font-size: 1.2rem; }
        .rank-pts { color: var(--neon-pink); text-align: right; }

        summary { color: var(--neon-cyan); font-weight: 900; cursor: pointer; padding: 5px; list-style: none; }
        summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="font-family:'Orbitron'; font-weight:900; color:var(--neon-cyan); letter-spacing:4px;">WYR OLYMPICS</div>
    </div>

    <div class="container">
        <div id="loginPage" class="page">
            <h1>IDENTITY</h1>
            <div class="card">
                <input type="text" id="realName" placeholder="REAL NAME">
                <input type="text" id="nickName" placeholder="NICKNAME">
                <button class="btn" onclick="registerUser()">START CAREER</button>
            </div>
        </div>

        <div id="homePage" class="page">
            <h1>COMMAND HUB</h1>
            <button class="btn" onclick="showPage('registerEventPage')">REGISTER FOR EVENTS</button>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                <button class="btn btn-nav" onclick="showPage('infoPage')">INFO</button>
                <button class="btn btn-nav" onclick="showPage('leaderboardPage')">RANK</button>
                <button class="btn btn-nav" onclick="showPage('participantsPage')">LIST</button>
            </div>
            <div class="card" style="margin-top:20px; text-align:center;">
                <h3 style="color:var(--neon-cyan); font-family:'Orbitron'; font-size:0.7rem; letter-spacing:2px;">ORGANISERS</h3>
                <p style="font-weight:900; font-size:1.3rem; margin-top:5px;">Ishaan & Yuvraj</p>
            </div>
        </div>

        <div id="infoPage" class="page">
            <p onclick="showPage('homePage')" style="color:#888; cursor:pointer; margin-bottom:15px;">← BACK TO HUB</p>
            <h1>INFO</h1>
            <div class="card">
                <h3 style="color:var(--neon-pink); font-family:'Orbitron'; font-size:0.9rem; margin-bottom:15px;">LIVE FEED</h3>
                <div id="liveUpdates"></div>
                
                <div id="adminPanel" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:15px;">
                    <p style="color:var(--neon-pink); font-size:0.6rem; margin-bottom:8px;">SAGEGOD ADMIN ACCESS</p>
                    <textarea id="adminMsg" placeholder="Type update..."></textarea>
                    <button class="btn" style="padding:10px; font-size:0.8rem;" onclick="postUpdate()">POST UPDATE</button>
                </div>
            </div>
            <div class="card">
                <p>• Join = +1 PT | Win = +5 PTS</p>
                <p>• Top players get the Wheel Spin.</p>
            </div>
        </div>

        <div id="leaderboardPage" class="page">
            <p onclick="showPage('homePage')" style="color:#888; cursor:pointer; margin-bottom:15px;">← BACK</p>
            <h1>RANKINGS</h1>
            <table><tbody id="leaderboardBody"></tbody></table>
        </div>

        <div id="participantsPage" class="page">
            <p onclick="showPage('homePage')" style="color:#888; cursor:pointer; margin-bottom:15px;">← BACK</p>
            <h1>PLAYER LIST</h1>
            <div id="participantContent"></div>
        </div>

        <div id="registerEventPage" class="page">
            <p onclick="showPage('homePage')" style="color:#888; cursor:pointer; margin-bottom:15px;">← BACK</p>
            <h1 id="displayId">ID: #---</h1>
            <div class="card" id="eventList"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:10px; height:10px; background:#0f0; border-radius:50%; box-shadow:0 0 10px #0f0;"></div>
            <span id="footerUser" style="font-family:'Orbitron'; font-weight:900; font-size:0.8rem;">OFFLINE</span>
        </div>
        <div id="footerID" style="color:var(--neon-pink); font-family:'Orbitron'; font-weight:900;">#000</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, orderBy, getDocs, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const EVENT_NAMES = ["Gaming Clash", "Speed Logic", "Mystery Task", "Skill Shot", "Final Showdown"];
    const firebaseConfig = {
        apiKey: "AIzaSyCz9cM7bUCAJnW2cr0qIZxaS60mWgRVAyM",
        authDomain: "wyr-olympics.firebaseapp.com",
        projectId: "wyr-olympics",
        storageBucket: "wyr-olympics.firebasestorage.app",
        messagingSenderId: "5860419843",
        appId: "1:5860419843:web:45f65b48d42c36850ae136"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentUser = JSON.parse(localStorage.getItem('wyr_user')) || null;

    window.showPage = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'participantsPage') loadParticipants();
        if(id === 'leaderboardPage') loadLeaderboard();
        if(id === 'infoPage') {
            loadUpdates();
            if(currentUser && (currentUser.nickName === "SageGod" || currentUser.nickName === "Sagegod")) {
                document.getElementById('adminPanel').style.display = 'block';
            }
        }
    };

    if (currentUser) { showPage('homePage'); updateUI(); } else { showPage('loginPage'); }

    window.registerUser = async () => {
        const rName = document.getElementById('realName').value.trim();
        const nName = document.getElementById('nickName').value.trim();
        if(!rName || !nName) return alert("Enter names!");
        const snap = await getDocs(collection(db, "players"));
        const id = (snap.size + 1).toString().padStart(3, '0'); 
        const user = { realName: rName, nickName: nName, id: id, points: 0, events: {e0:false, e1:false, e2:false, e3:false, e4:false} };
        await setDoc(doc(db, "players", id), user);
        localStorage.setItem('wyr_user', JSON.stringify(user));
        currentUser = user;
        showPage('homePage'); updateUI();
    };

    function updateUI() {
        if(!currentUser) return;
        document.getElementById('footerUser').innerText = currentUser.nickName.toUpperCase();
        document.getElementById('footerID').innerText = "#" + currentUser.id;
        document.getElementById('displayId').innerText = "PLAYER ID: #" + currentUser.id;
        renderEvents();
    }

    function renderEvents() {
        const list = document.getElementById('eventList');
        if(!list) return; list.innerHTML = '';
        EVENT_NAMES.forEach((name, i) => {
            const isPart = currentUser.events['e'+i];
            list.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #333;">
                <span style="font-weight:800;">${name}</span>
                <div onclick="toggleEvent(${i})" style="padding:10px 15px; border-radius:10px; font-weight:900; background:${isPart ? 'var(--neon-cyan)':'none'}; color:${isPart ? '#000':'#fff'}; border:2px solid ${isPart ? 'var(--neon-cyan)':'#444'}">
                    ${isPart ? 'JOINED' : 'JOIN'}
                </div>
            </div>`;
        });
    }

    window.toggleEvent = async (num) => {
        const key = 'e' + num; const status = !currentUser.events[key];
        currentUser.points += status ? 1 : -1; currentUser.events[key] = status;
        await updateDoc(doc(db, "players", currentUser.id), { points: currentUser.points, [`events.${key}`]: status });
        localStorage.setItem('wyr_user', JSON.stringify(currentUser)); renderEvents();
    };

    function loadUpdates() {
        onSnapshot(query(collection(db, "updates"), orderBy("time", "desc")), (snap) => {
            const div = document.getElementById('liveUpdates'); div.innerHTML = '';
            snap.forEach(d => {
                const data = d.data();
                const isSage = currentUser && (currentUser.nickName === "SageGod" || currentUser.nickName === "Sagegod");
                div.innerHTML += `<div class="feed-box">
                    <span class="feed-owner">ADMIN UPDATE</span>
                    <p>${data.msg}</p>
                    <span class="feed-time">${data.time ? data.time.toDate().toLocaleString() : 'Just now'}</span>
                    ${isSage ? `<button onclick="deletePost('${d.id}')" style="background:none; border:none; color:red; font-size:0.6rem; cursor:pointer; margin-top:5px;">[DELETE]</button>` : ''}
                </div>`;
            });
        });
    }

    window.postUpdate = async () => {
        const msg = document.getElementById('adminMsg').value; if(!msg) return;
        await addDoc(collection(db, "updates"), { msg: msg, time: serverTimestamp() });
        document.getElementById('adminMsg').value = '';
    };

    window.deletePost = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "updates", id)); };

    function loadParticipants() {
        onSnapshot(collection(db, "players"), (snap) => {
            let html = ''; const players = snap.docs.map(d => d.data());
            EVENT_NAMES.forEach((name, i) => {
                const joined = players.filter(p => p.events['e'+i]);
                html += `<details class="card" open><summary>${name}</summary>
                    <div style="margin-top:15px; border-left: 2px solid var(--neon-pink); padding-left:15px;">
                    ${joined.length > 0 ? joined.map(p => `<div style="margin-bottom:5px;">${p.nickName} <small style="color:#666">#${p.id}</small></div>`).join('') : 'None'}
                    </div></details>`;
            });
            document.getElementById('participantContent').innerHTML = html;
        });
    }

    function loadLeaderboard() {
        onSnapshot(query(collection(db, "players"), orderBy("points", "desc")), (snap) => {
            let html = ''; let r = 1;
            snap.forEach(doc => {
                const p = doc.data();
                html += `<tr><td class="rank-num">#${r}</td><td>${p.nickName}</td><td class="rank-pts">${p.points} PTS</td></tr>`;
                r++;
            });
            document.getElementById('leaderboardBody').innerHTML = html;
        });
    }
</script>
</body>
</html>
