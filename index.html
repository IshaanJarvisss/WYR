<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYR OLYMPICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --pink: #ff00e5; --glass: rgba(255, 255, 255, 0.03); }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Poppins', sans-serif; background: #050508; color: white; 
            padding: 80px 0; min-height: 100vh;
            background-image: radial-gradient(circle at top right, #0d0d12, #000);
        }

        /* --- SLEEK BARS --- */
        .top-bar {
            position: fixed; top: 0; width: 100%; height: 65px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,242,255,0.2);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .bottom-bar {
            position: fixed; bottom: 0; width: 100%; height: 65px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,0,229,0.2);
            display: flex; align-items: center; justify-content: space-around; z-index: 1000;
        }

        .container { width: 90%; max-width: 450px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.5s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-family: 'Orbitron'; font-size: 1.6rem; text-align: center; margin-bottom: 25px; color: var(--cyan); letter-spacing: 2px; }

        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 22px; margin-bottom: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        /* --- BUTTONS --- */
        .btn { 
            display: block; width: 100%; padding: 16px; margin: 12px 0; 
            background: var(--cyan); border: none; border-radius: 12px; 
            color: #000; font-family: 'Orbitron'; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn-nav { background: transparent; border: 1px solid var(--pink); color: var(--pink); font-size: 0.7rem; padding: 12px; border-radius: 10px; }
        .btn:active { transform: scale(0.98); }

        /* --- UPDATES --- */
        .update-item { border-left: 2px solid var(--cyan); padding-left: 12px; margin-bottom: 20px; }
        .update-msg { font-size: 0.95rem; line-height: 1.5; color: #ddd; }
        .update-time { font-size: 0.65rem; color: #555; display: block; margin-top: 4px; }
        #adminPanel { display: none; margin-top: 25px; border-top: 1px solid #222; padding-top: 20px; }

        input, textarea { width: 100%; padding: 14px; margin-bottom: 12px; background: rgba(0,0,0,0.3); border: 1px solid #333; border-radius: 10px; color: white; font-size: 1rem; }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 18px 8px; border-bottom: 1px solid #1a1a1a; font-size: 0.95rem; }
        .rank-num { font-family: 'Orbitron'; font-weight: 700; color: var(--cyan); }
        .nick { font-weight: 600; color: #fff; }
    </style>
</head>
<body>

    <div class="top-bar"><div style="font-family:'Orbitron'; color:var(--cyan); letter-spacing:4px; font-weight:700;">HUB</div></div>

    <div class="container">
        <div id="loginPage" class="page">
            <h1>IDENTITY</h1>
            <div class="card">
                <input type="text" id="realName" placeholder="Enter Full Name">
                <input type="text" id="nickName" placeholder="Enter Nickname">
                <button class="btn" onclick="registerUser()">ENTER OLYMPICS</button>
            </div>
        </div>

        <div id="homePage" class="page">
            <h1>DASHBOARD</h1>
            <button class="btn" onclick="showPage('registerEventPage')">EVENT REGISTRATION</button>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top: 10px;">
                <button class="btn btn-nav" onclick="showPage('infoPage')">INFO</button>
                <button class="btn btn-nav" onclick="showPage('leaderboardPage')">RANK</button>
                <button class="btn btn-nav" onclick="showPage('participantsPage')">LIST</button>
            </div>
            <div class="card" style="margin-top:25px; text-align:center; border-color: rgba(0,242,255,0.1);">
                <p style="font-size: 0.65rem; color: #555; letter-spacing: 3px; margin-bottom: 5px;">ORGANISERS</p>
                <p style="font-weight:600; font-size: 1.1rem; color: #eee;">Ishaan & Yuvraj</p>
            </div>
        </div>

        <div id="infoPage" class="page">
            <p onclick="showPage('homePage')" style="color:#555; cursor:pointer; margin-bottom:15px; font-size: 0.8rem;">← RETURN HUB</p>
            <h1>UPDATES</h1>
            <div class="card">
                <div id="liveUpdates"></div>
                
                <div id="adminPanel">
                    <p style="color:var(--pink); font-size:0.65rem; margin-bottom:8px; font-family:'Orbitron';">SAGEGOD ACCESS</p>
                    <textarea id="adminMsg" placeholder="Type an update..."></textarea>
                    <button class="btn" style="padding:10px; font-size:0.75rem;" onclick="postUpdate()">POST TO FEED</button>
                </div>
            </div>
            <div class="card">
                <p style="color:var(--cyan); font-weight:bold; margin-bottom:10px; font-size: 0.9rem;">RULES</p>
                <p style="font-size:0.85rem; line-height:1.6; color: #bbb;">• Participation = +1 Point<br>• Winning = +5 Points<br>• Fair play is monitored.</p>
            </div>
        </div>

        <div id="leaderboardPage" class="page">
            <p onclick="showPage('homePage')" style="color:#555; cursor:pointer; margin-bottom:15px; font-size: 0.8rem;">← RETURN HUB</p>
            <h1>LEADERBOARD</h1>
            <div class="card" style="padding: 10px;"><table><tbody id="leaderboardBody"></tbody></table></div>
        </div>

        <div id="participantsPage" class="page">
            <p onclick="showPage('homePage')" style="color:#555; cursor:pointer; margin-bottom:15px; font-size: 0.8rem;">← RETURN HUB</p>
            <h1>PLAYER LIST</h1>
            <div id="participantContent"></div>
        </div>

        <div id="registerEventPage" class="page">
            <p onclick="showPage('homePage')" style="color:#555; cursor:pointer; margin-bottom:15px; font-size: 0.8rem;">← RETURN HUB</p>
            <h1 id="displayId">ID: ---</h1>
            <div class="card" id="eventList" style="padding: 10px 20px;"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <div style="display:flex; align-items:center; gap:10px; font-family:'Orbitron'; font-size:0.75rem;">
            <div style="width:7px; height:7px; background:#0f0; border-radius:50%; box-shadow: 0 0 8px #0f0;"></div>
            <span id="footerUser">LOGIN REQUIRED</span>
        </div>
        <div id="footerID" style="color:var(--pink); font-family:'Orbitron'; font-size:0.75rem; font-weight:700;">#000</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, orderBy, getDocs, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const EVENT_NAMES = ["Gaming Clash", "Speed Logic", "Mystery Task", "Skill Shot", "Final Showdown"];
    const firebaseConfig = {
        apiKey: "AIzaSyCz9cM7bUCAJnW2cr0qIZxaS60mWgRVAyM",
        authDomain: "wyr-olympics.firebaseapp.com",
        projectId: "wyr-olympics",
        storageBucket: "wyr-olympics.firebasestorage.app",
        messagingSenderId: "5860419843",
        appId: "1:5860419843:web:45f65b48d42c36850ae136"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = JSON.parse(localStorage.getItem('wyr_user')) || null;

    window.showPage = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'participantsPage') loadParticipants();
        if(id === 'leaderboardPage') loadLeaderboard();
        if(id === 'infoPage') {
            loadUpdates();
            if(currentUser && (currentUser.nickName === "SageGod" || currentUser.nickName === "Sagegod")) {
                document.getElementById('adminPanel').style.display = 'block';
            }
        }
    };

    if (currentUser) { showPage('homePage'); updateUI(); } else { showPage('loginPage'); }

    window.registerUser = async () => {
        const rName = document.getElementById('realName').value.trim();
        const nName = document.getElementById('nickName').value.trim();
        if(!rName || !nName) return alert("Fill all fields!");
        const snap = await getDocs(collection(db, "players"));
        const id = (snap.size + 1).toString().padStart(3, '0'); 
        const user = { realName: rName, nickName: nName, id: id, points: 0, events: {e0:false, e1:false, e2:false, e3:false, e4:false} };
        await setDoc(doc(db, "players", id), user);
        localStorage.setItem('wyr_user', JSON.stringify(user));
        currentUser = user;
        showPage('homePage'); updateUI();
    };

    function updateUI() {
        if(!currentUser) return;
        document.getElementById('footerUser').innerText = currentUser.nickName.toUpperCase();
        document.getElementById('footerID').innerText = "#" + currentUser.id;
        document.getElementById('displayId').innerText = "PLAYER ID: #" + currentUser.id;
        renderEvents();
    }

    function renderEvents() {
        const list = document.getElementById('eventList');
        if(!list) return; list.innerHTML = '';
        EVENT_NAMES.forEach((name, i) => {
            const isPart = currentUser.events['e'+i];
            list.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #1a1a1a;">
                <span style="font-size:0.95rem; font-weight: 600;">${name}</span>
                <div onclick="toggleEvent(${i})" style="padding:8px 16px; border-radius:10px; font-size:0.75rem; font-weight:bold; background:${isPart ? 'var(--cyan)':'transparent'}; color:${isPart ? '#000':'#555'}; border:1px solid ${isPart ? 'var(--cyan)':'#333'}; cursor:pointer;">
                    ${isPart ? 'JOINED' : 'JOIN'}
                </div>
            </div>`;
        });
    }

    window.toggleEvent = async (num) => {
        const key = 'e' + num; const status = !currentUser.events[key];
        currentUser.points += status ? 1 : -1; currentUser.events[key] = status;
        await updateDoc(doc(db, "players", currentUser.id), { points: currentUser.points, [`events.${key}`]: status });
        localStorage.setItem('wyr_user', JSON.stringify(currentUser)); renderEvents();
    };

    function loadUpdates() {
        const q = query(collection(db, "updates"), orderBy("time", "desc"));
        onSnapshot(q, (snap) => {
            const div = document.getElementById('liveUpdates'); div.innerHTML = '';
            if(snap.empty) div.innerHTML = '<p style="color:#444; font-size:0.8rem;">No recent updates.</p>';
            snap.forEach(d => {
                const data = d.data();
                const isOwner = currentUser && (currentUser.nickName === "SageGod" || currentUser.nickName === "Sagegod");
                div.innerHTML += `<div class="update-item">
                    <p class="update-msg">${data.msg}</p>
                    <span class="update-time">${data.time ? data.time.toDate().toLocaleString() : 'Processing...'}</span>
                    ${isOwner ? `<button onclick="deletePost('${d.id}')" style="background:none; border:none; color:var(--pink); font-size:0.65rem; cursor:pointer; margin-top:5px;">[Remove Update]</button>` : ''}
                </div>`;
            });
        });
    }

    window.postUpdate = async () => {
        const msg = document.getElementById('adminMsg').value;
        if(!msg) return;
        await addDoc(collection(db, "updates"), { msg: msg, time: serverTimestamp() });
        document.getElementById('adminMsg').value = '';
    };

    window.deletePost = async (id) => { if(confirm("Permanently delete this update?")) await deleteDoc(doc(db, "updates", id)); };

    function loadParticipants() {
        onSnapshot(collection(db, "players"), (snap) => {
            let html = ''; const players = snap.docs.map(d => d.data());
            EVENT_NAMES.forEach((name, i) => {
                const joined = players.filter(p => p.events['e'+i]);
                html += `<div class="card" style="padding:18px;"><p style="color:var(--cyan); font-weight:700; font-size:0.85rem; margin-bottom:8px; font-family:'Orbitron'; text-transform:uppercase;">${name}</p>
                    <div style="font-size:0.85rem; color:#ccc;">${joined.length > 0 ? joined.map(p => `${p.nickName}`).join(', ') : '<span style="color:#444">Empty</span>'}</div></div>`;
            });
            document.getElementById('participantContent').innerHTML = html;
        });
    }

    function loadLeaderboard() {
        const q = query(collection(db, "players"), orderBy("points", "desc"));
        onSnapshot(q, (snap) => {
            let html = '';
            let rank = 1;
            snap.forEach((doc) => {
                const p = doc.data();
                html += `<tr>
                    <td class="rank-num">#${rank}</td>
                    <td class="nick">${p.nickName}</td>
                    <td style="text-align:right; font-weight:bold; color:var(--pink);">${p.points} PTS</td>
                </tr>`;
                rank++;
            });
            document.getElementById('leaderboardBody').innerHTML = html;
        });
    }
</script>
</body>
</html>
