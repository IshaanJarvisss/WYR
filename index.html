<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYR OLYMPICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --pink: #ff00e5; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Poppins', sans-serif; background: #050508; color: white; 
            padding: 80px 0; min-height: 100vh;
            background-image: radial-gradient(circle at top right, #111, #000);
        }

        /* --- CLEAN BARS --- */
        .top-bar {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,242,255,0.3);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .bottom-bar {
            position: fixed; bottom: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,0,229,0.3);
            display: flex; align-items: center; justify-content: space-around; z-index: 1000;
        }

        .container { width: 90%; max-width: 450px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-family: 'Orbitron'; font-size: 1.8rem; text-align: center; margin-bottom: 20px; color: var(--cyan); text-shadow: 0 0 15px rgba(0,242,255,0.4); }

        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(5px); }

        /* --- BUTTONS --- */
        .btn { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; 
            background: var(--cyan); border: none; border-radius: 10px; 
            color: #000; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; transition: 0.3s;
        }
        .btn-nav { background: transparent; border: 1px solid var(--pink); color: var(--pink); font-size: 0.75rem; padding: 10px; }
        .btn:hover { box-shadow: 0 0 20px var(--cyan); transform: translateY(-2px); }

        /* --- UPDATES --- */
        .update-item { border-left: 3px solid var(--cyan); padding-left: 10px; margin-bottom: 15px; font-size: 0.9rem; }
        .update-time { font-size: 0.6rem; color: #666; display: block; }
        #adminPanel { display: none; margin-top: 20px; border-top: 1px dashed var(--pink); padding-top: 15px; }

        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; background: #111; border: 1px solid #333; border-radius: 8px; color: white; }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 15px 5px; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .nick { font-weight: 600; color: var(--pink); }
    </style>
</head>
<body>

    <div class="top-bar"><div style="font-family:'Orbitron'; color:var(--cyan); letter-spacing:3px;">WYR OLYMPICS</div></div>

    <div class="container">
        <div id="loginPage" class="page">
            <h1>IDENTITY</h1>
            <div class="card">
                <input type="text" id="realName" placeholder="Real Name">
                <input type="text" id="nickName" placeholder="Nickname">
                <button class="btn" onclick="registerUser()">ENTER HUB</button>
            </div>
        </div>

        <div id="homePage" class="page">
            <h1>COMMAND HUB</h1>
            <button class="btn" onclick="showPage('registerEventPage')">REGISTER FOR EVENTS</button>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                <button class="btn btn-nav" onclick="showPage('infoPage')">INFO</button>
                <button class="btn btn-nav" onclick="showPage('leaderboardPage')">RANK</button>
                <button class="btn btn-nav" onclick="showPage('participantsPage')">LIST</button>
            </div>
            <div class="card" style="margin-top:20px; text-align:center;">
                <p style="font-size: 0.7rem; color: #888; letter-spacing: 2px;">ORGANISERS</p>
                <p style="font-weight:600;">Ishaan & Yuvraj</p>
            </div>
        </div>

        <div id="infoPage" class="page">
            <p onclick="showPage('homePage')" style="color:#666; cursor:pointer; margin-bottom:10px;">← BACK</p>
            <h1>INFO</h1>
            <div class="card">
                <h4 style="color:var(--pink); margin-bottom:10px; font-family:'Orbitron'; font-size:0.8rem;">LIVE UPDATES</h4>
                <div id="liveUpdates"></div>
                
                <div id="adminPanel">
                    <p style="color:var(--pink); font-size:0.6rem; margin-bottom:5px;">SAGEGOD ADMIN ACCESS</p>
                    <textarea id="adminMsg" placeholder="New update..."></textarea>
                    <button class="btn" style="padding:8px; font-size:0.7rem;" onclick="postUpdate()">POST</button>
                </div>
            </div>
            <div class="card" style="font-size:0.85rem; line-height:1.6;">
                <p>• Participation: +1 Point<br>• Winning: +5 Points<br>• Fair Play only.</p>
            </div>
        </div>

        <div id="leaderboardPage" class="page">
            <p onclick="showPage('homePage')" style="color:#666; cursor:pointer; margin-bottom:10px;">← BACK</p>
            <h1>RANKINGS</h1>
            <div class="card"><table><tbody id="leaderboardBody"></tbody></table></div>
        </div>

        <div id="participantsPage" class="page">
            <p onclick="showPage('homePage')" style="color:#666; cursor:pointer; margin-bottom:10px;">← BACK</p>
            <h1>PLAYER LIST</h1>
            <div id="participantContent"></div>
        </div>

        <div id="registerEventPage" class="page">
            <p onclick="showPage('homePage')" style="color:#666; cursor:pointer; margin-bottom:10px;">← BACK</p>
            <h1 id="displayId">ID: ---</h1>
            <div class="card" id="eventList"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <div style="display:flex; align-items:center; gap:8px; font-family:'Orbitron'; font-size:0.7rem;">
            <div style="width:6px; height:6px; background:#0f0; border-radius:50%;"></div>
            <span id="footerUser">OFFLINE</span>
        </div>
        <div id="footerID" style="color:var(--pink); font-family:'Orbitron'; font-size:0.7rem; font-weight:bold;">#000</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, orderBy, getDocs, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const EVENT_NAMES = ["Gaming Clash", "Speed Logic", "Mystery Task", "Skill Shot", "Final Showdown"];
    const firebaseConfig = {
        apiKey: "AIzaSyCz9cM7bUCAJnW2cr0qIZxaS60mWgRVAyM",
        authDomain: "wyr-olympics.firebaseapp.com",
        projectId: "wyr-olympics",
        storageBucket: "wyr-olympics.firebasestorage.app",
        messagingSenderId: "5860419843",
        appId: "1:5860419843:web:45f65b48d42c36850ae136"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = JSON.parse(localStorage.getItem('wyr_user')) || null;

    window.showPage = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'participantsPage') loadParticipants();
        if(id === 'leaderboardPage') loadLeaderboard();
        if(id === 'infoPage') {
            loadUpdates();
            // SHOW ADMIN PANEL ONLY FOR SAGEGOD
            if(currentUser && currentUser.nickName === "Sagegod") {
                document.getElementById('adminPanel').style.display = 'block';
            }
        }
    };

    if (currentUser) { showPage('homePage'); updateUI(); } else { showPage('loginPage'); }

    window.registerUser = async () => {
        const rName = document.getElementById('realName').value.trim();
        const nName = document.getElementById('nickName').value.trim();
        if(!rName || !nName) return alert("Fill fields!");
        const snap = await getDocs(collection(db, "players"));
        const id = (snap.size + 1).toString().padStart(3, '0'); 
        const user = { realName: rName, nickName: nName, id: id, points: 0, events: {e0:false, e1:false, e2:false, e3:false, e4:false} };
        await setDoc(doc(db, "players", id), user);
        localStorage.setItem('wyr_user', JSON.stringify(user));
        currentUser = user;
        showPage('homePage'); updateUI();
    };

    function updateUI() {
        if(!currentUser) return;
        document.getElementById('footerUser').innerText = currentUser.nickName.toUpperCase();
        document.getElementById('footerID').innerText = "#" + currentUser.id;
        document.getElementById('displayId').innerText = "ID: #" + currentUser.id;
        renderEvents();
    }

    function renderEvents() {
        const list = document.getElementById('eventList');
        if(!list) return; list.innerHTML = '';
        EVENT_NAMES.forEach((name, i) => {
            const isPart = currentUser.events['e'+i];
            list.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #222;">
                <span style="font-size:0.9rem;">${name}</span>
                <div onclick="toggleEvent(${i})" style="padding:6px 12px; border-radius:8px; font-size:0.7rem; font-weight:bold; background:${isPart ? 'var(--cyan)':'#111'}; color:${isPart ? '#000':'#fff'}; border:1px solid ${isPart ? 'var(--cyan)':'#333'}">
                    ${isPart ? 'JOINED' : 'JOIN'}
                </div>
            </div>`;
        });
    }

    window.toggleEvent = async (num) => {
        const key = 'e' + num; const status = !currentUser.events[key];
        currentUser.points += status ? 1 : -1; currentUser.events[key] = status;
        await updateDoc(doc(db, "players", currentUser.id), { points: currentUser.points, [`events.${key}`]: status });
        localStorage.setItem('wyr_user', JSON.stringify(currentUser)); renderEvents();
    };

    function loadUpdates() {
        const q = query(collection(db, "updates"), orderBy("time", "desc"));
        onSnapshot(q, (snap) => {
            const div = document.getElementById('liveUpdates'); div.innerHTML = '';
            snap.forEach(d => {
                const data = d.data();
                const isOwner = currentUser && currentUser.nickName === "Sagegod";
                div.innerHTML += `<div class="update-item">
                    <p>${data.msg}</p>
                    <span class="update-time">${data.time ? data.time.toDate().toLocaleString() : 'Just now'}</span>
                    ${isOwner ? `<button onclick="deletePost('${d.id}')" style="background:none; border:none; color:red; font-size:0.6rem; cursor:pointer;">[Delete]</button>` : ''}
                </div>`;
            });
        });
    }

    window.postUpdate = async () => {
        const msg = document.getElementById('adminMsg').value;
        if(!msg) return;
        await addDoc(collection(db, "updates"), { msg: msg, time: serverTimestamp() });
        document.getElementById('adminMsg').value = '';
    };

    window.deletePost = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "updates", id)); };

    function loadParticipants() {
        onSnapshot(collection(db, "players"), (snap) => {
            let html = ''; const players = snap.docs.map(d => d.data());
            EVENT_NAMES.forEach((name, i) => {
                const joined = players.filter(p => p.events['e'+i]);
                html += `<div class="card" style="padding:15px;"><p style="color:var(--cyan); font-weight:bold; font-size:0.8rem; margin-bottom:5px;">${name}</p>
                    <div style="font-size:0.8rem;">${joined.length > 0 ? joined.map(p => `${p.nickName}`).join(', ') : 'None'}</div></div>`;
            });
            document.getElementById('participantContent').innerHTML = html;
        });
    }

    function loadLeaderboard() {
        const q = query(collection(db, "players"), orderBy("points", "desc"));
        onSnapshot(q, (snap) => {
            let html = ''; snap.forEach((doc, idx) => {
                const p = doc.data();
                html += `<tr><td>#${idx+1}</td><td class="nick">${p.nickName}</td><td style="text-align:right;">${p.points} PTS</td></tr>`;
            });
            document.getElementById('leaderboardBody').innerHTML = html;
        });
    }
</script>
</body>
</html>
