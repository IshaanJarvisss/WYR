<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYR OLYMPICS | ELITE HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon-cyan: #00f2ff; 
            --neon-pink: #ff00e5; 
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(0, 242, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #020205; 
            color: white; 
            overflow-x: hidden; 
            min-height: 100vh;
            padding-top: 70px; /* Space for Top Bar */
            padding-bottom: 70px; /* Space for Bottom Bar */
            background-image: radial-gradient(circle at 50% 50%, #111 0%, #000 100%);
        }

        /* --- FIXED TOP BAR --- */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--neon-cyan);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; box-shadow: 0 5px 20px rgba(0, 242, 255, 0.2);
        }
        .logo { font-family: 'Orbitron'; font-weight: 900; font-size: 1.2rem; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); letter-spacing: 3px; }

        /* --- FIXED BOTTOM BAR --- */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px);
            border-top: 2px solid var(--neon-pink);
            display: flex; align-items: center; justify-content: space-around;
            z-index: 1000; box-shadow: 0 -5px 20px rgba(255, 0, 229, 0.2);
        }
        .user-status { font-family: 'Orbitron'; font-size: 0.75rem; color: #fff; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 8px; height: 8px; background: #0f0; border-radius: 50%; box-shadow: 0 0 10px #0f0; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* Massive Glowing Moon background */
        .moon { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; background: #fff; border-radius: 50%; box-shadow: 0 0 100px var(--neon-cyan); z-index: -1; opacity: 0.1; }

        .container { width: 95%; max-width: 500px; margin: 0 auto; position: relative; z-index: 1; }

        .page { display: none; animation: slideIn 0.4s ease-out; }
        .active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.2rem; text-align: center; margin-bottom: 20px; text-transform: uppercase; color: #fff; text-shadow: 0 0 15px var(--neon-cyan); }

        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* BUTTONS */
        .btn { 
            display: block; width: 100%; padding: 18px; margin: 12px 0; 
            background: linear-gradient(45deg, var(--neon-cyan), #0088ff); 
            border: none; border-radius: 15px; color: #000; 
            font-family: 'Orbitron'; font-weight: 900; font-size: 1rem; cursor: pointer;
            box-shadow: 0 0 15px var(--neon-cyan); transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); }

        .nav-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-nav { background: transparent; border: 1px solid var(--neon-pink); color: var(--neon-pink); font-size: 0.7rem; padding: 10px; }

        input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 12px; color: white; font-family: 'Poppins'; outline: none; }

        .event-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .event-name { font-weight: 700; font-size: 0.95rem; }
        .status-box { padding: 8px 15px; border-radius: 10px; font-weight: 900; font-size: 0.75rem; border: 2px solid #333; cursor: pointer; min-width: 90px; text-align: center; }
        .participating { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }

        /* Leaderboard Table */
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        tr { background: rgba(255,255,255,0.03); border-radius: 10px; }
        td { padding: 15px 10px; font-weight: 600; font-size: 0.9rem; }
        td:first-child { color: var(--neon-cyan); font-family: 'Orbitron'; border-radius: 10px 0 0 10px; }
        td:last-child { color: var(--neon-pink); text-align: right; border-radius: 0 10px 10px 0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">WYR OLYMPICS</div>
    </div>

    <div class="moon"></div>

    <div class="container">
        <div id="loginPage" class="page">
            <h1>WELCOME</h1>
            <div class="card">
                <input type="text" id="realName" placeholder="REAL NAME">
                <input type="text" id="nickName" placeholder="NICKNAME">
                <button class="btn" onclick="registerUser()">START CAREER</button>
            </div>
        </div>

        <div id="homePage" class="page">
            <h1>COMMAND HUB</h1>
            <button class="btn" onclick="showPage('registerEventPage')">REGISTER FOR EVENTS</button>
            <div class="nav-grid">
                <button class="btn btn-nav" onclick="showPage('infoPage')">RULES</button>
                <button class="btn btn-nav" onclick="showPage('leaderboardPage')">RANK</button>
                <button class="btn btn-nav" onclick="showPage('participantsPage')">LIST</button>
            </div>
            <div class="card" style="margin-top:20px;">
                <p style="color:var(--neon-cyan); font-weight:800;">COMMANDERS:</p>
                <p>Ishaan & Yuvraj</p>
            </div>
        </div>

        <div id="registerEventPage" class="page">
            <h1>EVENTS</h1>
            <div class="card">
                <div id="eventList"></div>
            </div>
            <button class="btn btn-nav" onclick="showPage('homePage')">BACK TO HUB</button>
        </div>

        <div id="participantsPage" class="page">
            <h1>PLAYER LIST</h1>
            <div id="participantContent"></div>
            <button class="btn btn-nav" onclick="showPage('homePage')">BACK TO HUB</button>
        </div>

        <div id="leaderboardPage" class="page">
            <h1>RANKINGS</h1>
            <table>
                <tbody id="leaderboardBody"></tbody>
            </table>
            <button class="btn btn-nav" onclick="showPage('homePage')">BACK TO HUB</button>
        </div>

        <div id="infoPage" class="page">
            <h1>PROTOCOL</h1>
            <div class="card">
                <p><strong>P01:</strong> Join = +1pt | Win = +5pts</p>
                <p><strong>P02:</strong> Fair Play is mandatory.</p>
                <p><strong>P03:</strong> Winners get the Cash Wheel.</p>
            </div>
            <button class="btn btn-nav" onclick="showPage('homePage')">BACK TO HUB</button>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="user-status">
            <div class="status-dot"></div>
            <span id="footerUser">Awaiting User...</span>
        </div>
        <div id="footerID" style="color:var(--neon-pink); font-family:'Orbitron'; font-size:0.7rem;">#000</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const EVENT_NAMES = ["Gaming Clash", "Speed Logic", "Mystery Task", "Skill Shot", "Final Showdown"];
    const firebaseConfig = {
        apiKey: "AIzaSyCz9cM7bUCAJnW2cr0qIZxaS60mWgRVAyM",
        authDomain: "wyr-olympics.firebaseapp.com",
        projectId: "wyr-olympics",
        storageBucket: "wyr-olympics.firebasestorage.app",
        messagingSenderId: "5860419843",
        appId: "1:5860419843:web:45f65b48d42c36850ae136"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = JSON.parse(localStorage.getItem('wyr_user')) || null;

    window.showPage = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'participantsPage') loadParticipants();
        if(id === 'leaderboardPage') loadLeaderboard();
        window.scrollTo(0,0);
    };

    if (currentUser) { showPage('homePage'); updateUI(); } else { showPage('loginPage'); }

    window.registerUser = async () => {
        const rName = document.getElementById('realName').value.trim();
        const nName = document.getElementById('nickName').value.trim();
        if(!rName || !nName) return alert("Identify yourself!");
        const querySnapshot = await getDocs(collection(db, "players"));
        const id = (querySnapshot.size + 1).toString().padStart(3, '0'); 
        const userData = { realName: rName, nickName: nName, id: id, points: 0, events: {e0:false, e1:false, e2:false, e3:false, e4:false} };
        await setDoc(doc(db, "players", id), userData);
        localStorage.setItem('wyr_user', JSON.stringify(userData));
        currentUser = userData;
        showPage('homePage');
        updateUI();
    };

    function updateUI() {
        if(!currentUser) return;
        document.getElementById('footerUser').innerText = currentUser.nickName.toUpperCase();
        document.getElementById('footerID').innerText = "#" + currentUser.id;
        renderEvents();
    }

    function renderEvents() {
        const list = document.getElementById('eventList');
        if(!list) return;
        list.innerHTML = '';
        EVENT_NAMES.forEach((name, i) => {
            const isPart = currentUser.events['e'+i];
            list.innerHTML += `<div class="event-row"><span class="event-name">${name}</span><div class="status-box ${isPart ? 'participating' : ''}" onclick="toggleEvent(${i})">${isPart ? 'JOINED' : 'JOIN'}</div></div>`;
        });
    }

    window.toggleEvent = async (num) => {
        const key = 'e' + num;
        const status = !currentUser.events[key];
        currentUser.points += status ? 1 : -1;
        currentUser.events[key] = status;
        await updateDoc(doc(db, "players", currentUser.id), { points: currentUser.points, [`events.${key}`]: status });
        localStorage.setItem('wyr_user', JSON.stringify(currentUser));
        renderEvents();
    };

    function loadParticipants() {
        onSnapshot(collection(db, "players"), (snap) => {
            let html = '';
            const players = snap.docs.map(d => d.data());
            EVENT_NAMES.forEach((name, i) => {
                const joined = players.filter(p => p.events['e'+i]);
                html += `<details class="card" open><summary style="color:var(--neon-cyan); font-weight:900; cursor:pointer;">${name}</summary>
                    <div style="margin-top:10px; border-left: 2px solid var(--neon-pink); padding-left:15px;">
                    ${joined.length > 0 ? joined.map(p => `<div style="margin-bottom:5px;">${p.nickName} <small style="color:#666">#${p.id}</small></div>`).join('') : 'None'}
                    </div></details>`;
            });
            document.getElementById('participantContent').innerHTML = html;
        });
    }

    function loadLeaderboard() {
        const q = query(collection(db, "players"), orderBy("points", "desc"));
        onSnapshot(q, (snap) => {
            let html = '';
            snap.docs.forEach((doc, idx) => {
                const p = doc.data();
                html += `<tr><td>#${idx+1}</td><td>${p.nickName}<br><small style="color:#555">ID:${p.id}</small></td><td>${p.points} PTS</td></tr>`;
            });
            document.getElementById('leaderboardBody').innerHTML = html;
        });
    }
</script>
</body>
</html>
