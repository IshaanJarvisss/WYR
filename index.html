<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYR Olympics Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon-cyan: #00f2ff; --neon-pink: #ff00e5; --moon: #fff; --bg: #050505; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; overflow-x: hidden; min-height: 100vh; }
        
        /* Neon Moon */
        .moon { position: fixed; top: 30px; right: 30px; width: 60px; height: 60px; background: var(--moon); border-radius: 50%; box-shadow: 0 0 30px var(--neon-cyan); z-index: -1; animation: float 4s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .container { max-width: 500px; margin: 0 auto; padding: 25px; text-align: center; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); margin-bottom: 20px; font-size: 2rem; }
        .card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(0,242,255,0.2); margin-top: 15px; text-align: left; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #333; color: white; border-radius: 8px; font-family: 'Poppins'; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid var(--neon-cyan); background: transparent; color: var(--neon-cyan); font-family: 'Orbitron'; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; text-decoration: none; }
        .btn:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 15px var(--neon-cyan); }
        .btn-s { padding: 8px; font-size: 0.7rem; border-color: var(--neon-pink); color: var(--neon-pink); margin: 2px; }

        .event-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; }
        .status-box { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; border: 1px solid #444; min-width: 120px; text-align: center; }
        .participating { background: var(--neon-cyan); color: black; border-color: var(--neon-cyan); font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222; }
        th { color: var(--neon-cyan); font-family: 'Orbitron'; font-size: 0.8rem; }
        .nick-tag { color: var(--neon-pink); font-weight: 600; }
        .id-badge { font-size: 0.7rem; background: #222; padding: 2px 6px; border-radius: 4px; margin-left: 5px; color: #aaa; }
    </style>
</head>
<body>

<div class="moon"></div>

<div class="container">
    <div id="loginPage" class="page">
        <h1>Register</h1>
        <input type="text" id="realName" placeholder="Real Name">
        <input type="text" id="nickName" placeholder="Nick Name">
        <button class="btn" onclick="registerUser()">Start Journey</button>
    </div>

    <div id="homePage" class="page">
        <h1>WYR OLYMPIC</h1>
        <button class="btn" onclick="showPage('registerEventPage')">Register in Event</button>
        <div style="display: flex; justify-content: space-between;">
            <button class="btn btn-s" onclick="showPage('infoPage')">Info</button>
            <button class="btn btn-s" onclick="showPage('leaderboardPage')">Leaderboard</button>
            <button class="btn btn-s" onclick="showPage('participantsPage')">Participants</button>
        </div>
        <div class="card">
            <p><strong>Organiser:</strong> Ishaan & Yuvraj</p>
            <p style="font-size: 0.8rem; color: #aaa;">WhatsApp Ishaan for support.</p>
        </div>
    </div>

    <div id="registerEventPage" class="page">
        <button onclick="showPage('homePage')" style="color:grey; background:none; border:none; margin-bottom:10px;">← Back</button>
        <h2 id="displayId" style="color:var(--neon-pink); font-family:'Orbitron';">ID: ---</h2>
        <div id="eventList"></div>
    </div>

    <div id="participantsPage" class="page">
        <button onclick="showPage('homePage')" style="color:grey; background:none; border:none;">← Back</button>
        <h1>Participants</h1>
        <div id="participantContent"></div>
    </div>

    <div id="leaderboardPage" class="page">
        <button onclick="showPage('homePage')" style="color:grey; background:none; border:none;">← Back</button>
        <h1>Leaderboard</h1>
        <table>
            <thead><tr><th>Rank</th><th>Player</th><th>Pts</th></tr></thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
    </div>

    <div id="infoPage" class="page">
        <button onclick="showPage('homePage')" style="color:grey; background:none; border:none;">← Back</button>
        <h1>Rules</h1>
        <div class="card" style="font-size: 0.8rem; line-height: 1.6;">
            WYR OLYMPICS – 5 Days, 5 Challenges.<br><br>
            • Participation: +1 Point<br>
            • Winning: +5 Points<br>
            • Fair play only. Top 2 get the Reward Wheel!
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCz9cM7bUCAJnW2cr0qIZxaS60mWgRVAyM",
        authDomain: "wyr-olympics.firebaseapp.com",
        projectId: "wyr-olympics",
        storageBucket: "wyr-olympics.firebasestorage.app",
        messagingSenderId: "5860419843",
        appId: "1:5860419843:web:45f65b48d42c36850ae136"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = JSON.parse(localStorage.getItem('wyr_user')) || null;

    window.showPage = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'participantsPage') loadParticipants();
        if(id === 'leaderboardPage') loadLeaderboard();
    };

    if (currentUser) { showPage('homePage'); updateUI(); } else { showPage('loginPage'); }

    window.registerUser = async () => {
        const rName = document.getElementById('realName').value;
        const nName = document.getElementById('nickName').value;
        if(!rName || !nName) return alert("Fill both fields!");

        // Sequential ID Logic (001, 002...)
        const querySnapshot = await getDocs(collection(db, "players"));
        const count = querySnapshot.size + 1;
        const id = count.toString().padStart(3, '0'); 

        const userData = { realName: rName, nickName: nName, id: id, points: 0, events: {e1:false, e2:false, e3:false, e4:false, e5:false} };
        
        await setDoc(doc(db, "players", id), userData);
        localStorage.setItem('wyr_user', JSON.stringify(userData));
        currentUser = userData;
        showPage('homePage');
        updateUI();
    };

    function updateUI() {
        if(!currentUser) return;
        document.getElementById('displayId').innerText = "PLAYER ID: " + currentUser.id;
        renderEvents();
    }

    function renderEvents() {
        const list = document.getElementById('eventList');
        list.innerHTML = '';
        for(let i=1; i<=5; i++) {
            const isPart = currentUser.events['e'+i];
            list.innerHTML += `
                <div class="event-row">
                    <span>Event ${i}</span>
                    <div class="status-box ${isPart ? 'participating' : ''}" onclick="toggleEvent(${i})">
                        ${isPart ? 'Joined ✓' : 'Participate?'}
                    </div>
                </div>`;
        }
    }

    window.toggleEvent = async (num) => {
        const key = 'e' + num;
        const status = !currentUser.events[key];
        currentUser.points += status ? 1 : -1;
        currentUser.events[key] = status;

        await updateDoc(doc(db, "players", currentUser.id), {
            points: currentUser.points,
            [`events.${key}`]: status
        });
        localStorage.setItem('wyr_user', JSON.stringify(currentUser));
        renderEvents();
    };

    function loadParticipants() {
        onSnapshot(collection(db, "players"), (snap) => {
            let html = '';
            const players = snap.docs.map(d => d.data());
            for(let i=1; i<=5; i++) {
                const joined = players.filter(p => p.events['e'+i]);
                html += `
                <details class="card" open><summary style="color:var(--neon-cyan); cursor:pointer; font-weight:bold;">Event ${i}</summary>
                    <div style="margin-top:10px;">
                    ${joined.length > 0 ? joined.map(p => `<div><span class="nick-tag">${p.nickName}</span> <span class="id-badge">${p.id}</span></div>`).join('') : 'No participants yet'}
                    </div>
                </details>`;
            }
            document.getElementById('participantContent').innerHTML = html;
        });
    }

    function loadLeaderboard() {
        const q = query(collection(db, "players"), orderBy("points", "desc"));
        onSnapshot(q, (snap) => {
            let html = '';
            snap.docs.forEach((doc, idx) => {
                const p = doc.data();
                html += `<tr><td>#${idx+1}</td><td><span class="nick-tag">${p.nickName}</span><br><small>${p.id}</small></td><td style="color:var(--neon-cyan); font-weight:bold;">${p.points}</td></tr>`;
            });
            document.getElementById('leaderboardBody').innerHTML = html;
        });
    }
</script>
</body>
</html>
